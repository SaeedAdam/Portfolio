about:
  title: "نبذة عني"
  description: |
    أنا مهندس ‎.NET أول أركّز على بناء تطبيقات مؤسسية وأنظمة خلفية موثوقة وسهلة الصيانة. أعمل بشكل أساسي مع ASP.NET Core والتصميم الموجّه بالمجال (DDD) وSQL Server وPostgreSQL وDocker و Azure DevOps، كما أعمل بارتياح على الواجهات الأمامية باستخدام Angular وVue.js و Nuxt.

    أستمتع بتحويل سير العمل المعقّد في الأعمال إلى أنظمة واضحة ومنظّمة يستطيع الفريق تطويرها بثقة. أحرص على فهم المشكلة قبل كتابة الشيفرة، وعلى تقديم أبسط حلّ يعالجها فعلًا.
