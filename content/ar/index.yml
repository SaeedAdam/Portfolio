about:
  title: "نبذة عني"
  description: |
    أنا مهندس برمجيات أول متخصص في ‎.NET، أعمل على بناء تطبيقات مؤسسية وأنظمة خلفية موثوقة وسهلة الصيانة. أستخدم في عملي اليومي ASP.NET Core والتصميم الموجّه بالمجال (DDD) وSQL Server وPostgreSQL وDocker و Azure DevOps، وأعمل أيضًا على الواجهات الأمامية باستخدام Angular وVue.js و Nuxt.

    أحب تحويل العمليات المعقّدة إلى أنظمة واضحة يسهل على الفريق تطويرها بثقة. أفهم المشكلة أولًا، ثم أختار الحل الأنسب لها.
